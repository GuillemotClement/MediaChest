name: mediachest-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  front:
    build: ./front
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mediachest:${POSTGRES_PASSWORD:?Initialiser .env.prod}@db:5432/mediachest
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Initialiser .env.prod}
      BETTER_AUTH_URL: ${APP_URL:?Renseigner l URL du Raspberry dans .env.prod}
      FRONTEND_URL: ${APP_URL:?Renseigner APP_URL}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Initialiser .env.prod}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:?Renseigner le jeton TMDB dans .env.prod}
      TRUST_PROXY: "1"
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: mediachest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Initialiser .env.prod}
      POSTGRES_DB: mediachest
    volumes:
      - postgres_data:/var/lib/postgresql
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12
      start_period: 30s
      timeout: 5s

volumes:
  postgres_data:
