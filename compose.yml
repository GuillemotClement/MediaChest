services:
  frontend:
    build:
      context: "./frontend"
      dockerfile: Dockerfile.dev
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8010}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: "./backend"
      dockerfile: Dockerfile.dev
    init: true
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-8010}
      - DATABASE_URL=${DATABASE_URL:-postgresql://db:db@db:5432/mediachest}
      - FRONT_URL=${FRONT_URL:-http://localhost:5173}
    ports:
      - "8010:8010"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-db}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-db}
      - POSTGRES_DB=${POSTGRES_DB:-mediachest}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:${POSTGRES_DATA_PATH:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  adminer:
    image: adminer:6.2.0
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - ADMINER_DEFAULT_SERVER=db

volumes:
  postgres_data:
    driver: local
    name: ${POSTGRES_VOLUME_NAME:-postgres_data}
