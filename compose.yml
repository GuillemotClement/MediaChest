services:
  front:
    build: ./front
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./api
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pg}:${POSTGRES_PASSWORD:-pg}@db:5432/${POSTGRES_DB:-mediachest}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:5173}
      FRONTEND_URL: ${APP_URL:-http://localhost:5173}
      PORT: 3000
    volumes:
      - auth_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pg}
      - POSTGRES_DB=${POSTGRES_DB:-mediachest}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:${POSTGRES_DATA_PATH:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  adminer:
    image: adminer:6.2.0
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - ADMINER_DEFAULT_SERVER=db

volumes:
  auth_data:
  postgres_data:
    driver: local
    name: ${POSTGRES_VOLUME_NAME:-postgres_data}
